# config/config.yaml
# Single Source of Truth for Project Config and Design Tokens

default_lang: "vi" # Fallback language if not provided via CLI

fonts:
  sans:  "Tex Gyre Adventor"
  serif: "CMU Serif"
  mono:  "Google Sans Code"

colors:
  # Touying Aqua Theme Core Colors
  primary:          "#003F88"
  primary-light:    "#2159A5"
  primary-lightest: "#F2F4F8"
  neutral-lightest: "#FFFFFF"

  # Semantic Colors (For Callouts & Alerts)
  note:    "#003F88"
  info:    "#008080"
  warning: "#FFA500"
  error:   "#FF0000"
  success: "#008000"

ui:
  radius: 8 # Represents 8pt
